name: Fix Dialogue completed-answer and actual scroll navigation
on:
  push:
    paths:
      - '.github/workflows/fix-dialogue-answer-scroll.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dialogue state and scroll gesture without changing other modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def replace_once(old,new):
              global s
              n=s.count(old)
              assert n==1,(old[:90],n)
              s=s.replace(old,new,1)
          replace_once("let dialogueCat=null, dialogueIndex=0, dialogueMode='text', dialogueRecognizer=null;",
                       "let dialogueCat=null, dialogueIndex=0, dialogueMode='text', dialogueRecognizer=null;\nlet dialogueAnswerChecked=false;")
          replace_once("function showDialogue(cat,idx){",
                       "function showDialogue(cat,idx){\n dialogueAnswerChecked=false;")
          replace_once("if(activeView!=='dialogue'||!dialogueCat)return;",
                       "if(activeView!=='dialogue'||!dialogueCat||!dialogueAnswerChecked)return;")
          replace_once("const similarity=dialogueSimilarity(text,target);",
                       "dialogueAnswerChecked=true;\\n  const similarity=dialogueSimilarity(text,target);")
          replace_once("const titleMap={",
                       "dialogueAnswerChecked=true;\\n    const titleMap={")
          a=s.index('(function enableDialogueSwipe(){')
          b=s.index(" document.addEventListener('keydown',e=>{",a)
          original=s[a:b]
          assert "edgeAtStart" in original and "dialogueMove(next?1:-1)" in original
          new="""(function enableDialogueSwipe(){
           let start=null;
           const reset=()=>{start=null;};
           const interactive=el=>!!(el&&el.closest&&el.closest('button,a,input,select,textarea,label,[role="button"],.mobile-bottom-nav,.nav-action'));
           function scrollContainer(){
             const panel=document.getElementById('specialView');
             const doc=document.scrollingElement||document.documentElement;
             // Dialogue may scroll inside #specialView or at document level depending
             // on viewport layout. Choose a container that can actually scroll.
             if(panel&&panel.scrollHeight>panel.clientHeight+6&&
                /(auto|scroll)/.test(getComputedStyle(panel).overflowY))return panel;
             return doc;
           }
           function position(box){
             const top=box.scrollTop;
             const max=Math.max(0,box.scrollHeight-box.clientHeight);
             return {overflow:max>6,top:top<=4,bottom:top>=max-4};
           }
           document.addEventListener('touchstart',e=>{
             reset();
             if(activeView!=='dialogue'||e.touches.length!==1||interactive(e.target))return;
             const box=scrollContainer();
             start={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now(),
               box,edge:position(box)};
           },{passive:true,capture:true});
           document.addEventListener('touchend',e=>{
             const g=start;reset();
             if(!g||activeView!=='dialogue'||!e.changedTouches.length||!dialogueAnswerChecked)return;
             const dx=e.changedTouches[0].clientX-g.x,dy=e.changedTouches[0].clientY-g.y;
             if(Math.abs(dy)<60||Math.abs(dy)<=Math.abs(dx)*1.2||Date.now()-g.time>=1200)return;
             const next=dy<0,now=position(g.box);
             // Never change lesson on the gesture that merely reaches a scroll edge.
             if(!g.edge.overflow||(next?g.edge.bottom&&now.bottom:g.edge.top&&now.top)){
               dialogueMove(next?1:-1);
             }
           },{passive:true,capture:true});
           document.addEventListener('touchcancel',reset,{passive:true,capture:true});
          """
          s=s[:a]+new+s[b:]
          assert s.count('dialogueAnswerChecked=true;')==2
          assert s.count('(function enableDialogueSwipe(){')==1
          assert s.count('(function enableGrammarLessonSwipe(){')==1
          assert s.count('(function enableQuizSwipeNext(){')==1
          p.write_text(s,encoding='utf-8')
          print('Dialogue-only change complete')
          PY
      - name: Validate JS and patch scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('let dialogueCat=null')
          b=s.index('function dialogueStartMic(){',a)
          Path('/tmp/dialogue-updated.js').write_text(s[a:b],encoding='utf-8')
          assert 'let dialogueAnswerChecked=false' in s[a:b]
          assert 'document.scrollingElement' in s[a:b]
          PY
          node --check /tmp/dialogue-updated.js
          git diff --check
          git diff --stat -- index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Require checked Dialogue answer and scroll to real edge before swipe navigation"
          git push
