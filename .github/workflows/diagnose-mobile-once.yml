name: Diagnose mobile Progress and module swipe
on:
  push:
    paths:
      - '.github/workflows/diagnose-mobile-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HTML without modifying files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for word in ['/* v4.6.7: compact progress table for phone screens */', 'function markActiveNav', 'function showSpecial(', 'function showLearningView()', 'class="mobile-nav-action nav-action"', 'function enableHorizontalModuleSwipe', 'progress-scroll .progress-table']:
           print("\nTARGET",word)
           pos=s.find(word)
           print(s[max(0,pos-100):pos+1600] if pos!=-1 else "not found")
          print('\nCSS Progress occurrences')
          for m in list(re.finditer(r'[^{}]{0,220}(?:progress-table|progress-scroll)[^{}]{0,220}\{[^{}]{0,500}\}',s[:100000],re.I)):
           print(s[m.start():m.end()].replace('\n',' ')[:600])
          print('\nNAV BUTTONS')
          for m in re.finditer(r'<button class="mobile-nav-action nav-action"[^>]+>',s):
           print(m.group()[:170])
          print('\nACTIVE VIEW HANDLERS')
          for m in list(re.finditer(r'activeView\s*=\s*',s))[-18:]:
           print(s[m.start()-120:m.start()+180].replace('\n',' '))
          PY
