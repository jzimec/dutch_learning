name: Release corrected Dutch login authentication
on:
  push:
    paths:
      - '.github/workflows/release-auth-login-direct.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify auth SDK and browser JS
        run: |
          node --check dutch-auth.js
          curl -fsSL --retry 2 --max-time 25 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js -o /tmp/supabase-sdk.js
          test -s /tmp/supabase-sdk.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          old='<script src="./dutch-auth.js?v=5"></script>'
          assert s.count(old)==1, 'current auth script reference unexpected'
          assert Path('dutch-auth.js').read_text(encoding='utf8').count('skipSessionCheck')>=3
          p.write_text(s.replace(old,'<script src="./dutch-auth.js?v=6"></script>',1),encoding='utf8')
          PY
      - name: Commit only account cache-buster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Load direct login with Supabase auth SDK update"
          git push
