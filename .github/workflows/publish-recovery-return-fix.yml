name: Verify and publish password recovery return fix
on:
  push:
    paths:
      - '.github/workflows/publish-recovery-return-fix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery JS and update cache
        run: |
          node --check dutch-auth.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('dutch-auth.js').read_text(encoding='utf-8')
          assert 'const recovering=/' in a
          assert 'if(!error&&session?.user)showPasswordRecovery()' in a
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./dutch-auth.js?v=6"></script>'
          assert s.count(old)==1,'Unexpected login script version'
          s=s.replace(old,'<script src="./dutch-auth.js?v=7"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache version only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Load fixed Supabase password recovery redirect flow"
          git push
