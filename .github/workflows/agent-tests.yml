name: Dutch Learning agent checks
on:
  push:
    branches:
      - refactor/modular-login-20261117
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate task queue and auth syntax
        run: node agent/validate.mjs
