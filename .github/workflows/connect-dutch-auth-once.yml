name: Connect Dutch account login to Dialogue AI
on:
  push:
    paths:
      - '.github/workflows/connect-dutch-auth-once.yml'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Dialogue token prompt with login and connect v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          assert s.count("async function dialogueCheck(value,isVoice){")==1
          assert s.count("function dialogueCheckOffline(value,isVoice){")==1
          assert s.count('dialogue-ai-config.js?v=1')==1
          start=s.index("  let token=window.__dutchDialogueAiToken||'';",s.index("async function dialogueCheck(value,isVoice){"))
          stop=s.index("  result.innerHTML='<div class=\\\"dialogue-feedback warn\\\">AI 正在检查语法与句意…</div>';",start)
          old=s[start:stop]
          assert "window.prompt(" in old and "sessionStorage" in old
          new="""  let token='';
          try{
            if(!window.dutchAuth)throw new Error('登录组件正在加载，请刷新页面重试');
            token=await window.dutchAuth.ensure();
          }catch(e){
            result.innerHTML='<div class="dialogue-feedback warn">'+dialogueEscape(e?.message||'登录未完成')+'</div>';
            return;
          }
          """
          s=s[:start]+new+s[stop:]
          old401="""    if(reply.status===401){
              window.__dutchDialogueAiToken='';
              try{sessionStorage.removeItem('dutchDialogueAiToken');}catch(e){}
              throw new Error('访问密码无效；已清除本次会话的密码，请重新点击检查。');
            }"""
          # Allow indentation differences while keeping exact controlled block structure.
          import re
          rx=r"    if\\(reply\\.status===401\\)\\{[\\s\\S]*?throw new Error\\('访问密码无效；已清除本次会话的密码，请重新点击检查。'\\);\\n    \\}"
          s,num=re.subn(rx,"    if(reply.status===401)throw new Error('登录已失效，请在账户中重新登录。');",s,count=1)
          assert num==1, 'original 401 handler not found'
          s=s.replace("headers:{'Content-Type':'application/json','x-dialogue-token':token},","headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},",1)
          assert "headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}," in s
          # v2 path must be accepted by endpoint validation.
          needle="\\.supabase\\.co\\/functions\\/v1\\/dialogue-check\\/?$"
          assert s.count(needle)==1
          s=s.replace(needle,"\\.supabase\\.co\\/functions\\/v1\\/dialogue-check-v2\\/?$",1)
          s=s.replace('<script src="./dialogue-ai-config.js?v=1"></script>','<script src="./dialogue-ai-config.js?v=1"></script>\\n<script src="./dutch-auth.js?v=1"></script>',1)
          assert s.count('dutch-auth.js?v=1')==1
          p.write_text(s,encoding="utf-8")
          config=Path("dialogue-ai-config.js")
          t=config.read_text(encoding="utf-8")
          oldurl="https://uxzyswpxwqcjvgkjlwhv.supabase.co/functions/v1/dialogue-check"
          assert t.count(oldurl)==1
          config.write_text(t.replace(oldurl,oldurl+"-v2",1),encoding="utf-8")
          print("Only Dialogue AI authorization and its endpoint changed")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check dutch-auth.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('async function dialogueCheck(value,isVoice){')
          b=s.index('function dialogueStartMic(){',a)
          Path('/tmp/dialogue-auth-check.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dialogue-auth-check.js
      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dialogue-ai-config.js
          git diff --cached --check
          git commit -m "Use Supabase account login instead of Dialogue AI access token"
          git push
