name: Publish persistent recovery return route
on:
  push:
    paths:
      - '.github/workflows/publish-recovery-route-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery URL and JS
        run: |
          node --check dutch-auth.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('dutch-auth.js').read_text()
          assert 'RECOVERY_URL="https://jzimec.github.io/dutch_learning/?auth=recovery"' in js
          assert 'recoverySeen=true' in js
          assert 'if(recovering||recoverySeen)' in js
          p=Path('index.html');s=p.read_text(encoding='utf8')
          old='<script src="./dutch-auth.js?v=7"></script>'
          assert s.count(old)==1
          p.write_text(s.replace(old,'<script src="./dutch-auth.js?v=8"></script>',1),encoding='utf8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Load durable password recovery route"
          git push
