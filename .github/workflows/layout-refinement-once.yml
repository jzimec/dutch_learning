name: One-time Dutch Learning layout refinement
on:
  push:
    paths:
      - '.github/workflows/layout-refinement-once.yml'
permissions:
  contents: write
jobs:
  adjust-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place Learn audio top-right and Quiz audio page bottom-right
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          assert s.count('id="wordAudio"') == 1
          assert s.count('id="sentenceAudio"') == 1
          assert s.count('id="reviewQuizAudio"') == 1
          assert s.count('class="mobile-nav-action nav-action') == 6
          pattern=r'\n<style>\n/\* Scoped layout adjustment: bottom navigation and Quiz only\. \*/.*?</style>\n'
          s,n=re.subn(pattern,'\n',s,count=1,flags=re.S)
          assert n==1,"Previously added scoped stylesheet not found"
          css="<style>\n/* User-requested placement: Learn audio at each card top-right; Quiz audio at page bottom-right. */\n@media (max-width:1000px), (pointer:coarse) {\n  .mobile-bottom-nav {display:flex!important;justify-content:space-between!important;gap:0!important;overflow-x:hidden!important;}\n  .mobile-bottom-nav > .mobile-nav-action {flex:1 1 0!important;width:0!important;min-width:0!important;max-width:none!important;box-sizing:border-box!important;}\n  .mobile-bottom-nav > .mobile-nav-action small {overflow:hidden;text-overflow:ellipsis;max-width:100%;}\n}\n.mobile-word-card .title-row,\n.mobile-sentence-card .sentence-mobile-title {\n  display:flex!important;align-items:flex-start!important;justify-content:space-between!important;width:100%;\n}\n.mobile-word-card .title-row > .learn-audio-stack,\n.mobile-sentence-card .sentence-mobile-title > .learn-audio-stack {\n  margin-left:auto!important;align-self:flex-start!important;justify-content:flex-start!important;\n  flex-shrink:0!important;transform:none!important;\n}\n.review-quiz-word {padding-bottom:0!important;position:static!important;}\n.review-quiz-word > .review-quiz-audio-controls {\n  position:fixed!important;right:14px!important;bottom:calc(78px + env(safe-area-inset-bottom))!important;\n  top:auto!important;left:auto!important;z-index:9998!important;margin:0!important;\n  display:flex!important;align-items:center!important;gap:6px!important;\n  padding:5px!important;border-radius:13px!important;\n  background:rgba(255,255,255,.97)!important;box-shadow:0 2px 14px rgba(0,0,0,.12)!important;\n}\n.review-quiz-word > .review-quiz-audio-controls > .audio.small {\n  width:43px!important;height:37px!important;min-width:43px!important;min-height:37px!important;\n  border:1px solid #a9bfd5!important;border-radius:12px!important;\n  background:#f5f9ff!important;color:#263a4d!important;box-shadow:none!important;\n  padding:3px!important;font-size:21px!important;line-height:1.1!important;\n  display:inline-flex!important;align-items:center!important;justify-content:center!important;\n}\n@media (min-width:1001px) and (pointer:fine) {\n .review-quiz-word > .review-quiz-audio-controls {bottom:18px!important;right:18px!important;}\n}\n</style>"
          assert s.count("</head>")==1
          s=s.replace("</head>","\n"+css+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          print("Updated Learn top-right and Quiz fixed page bottom-right; six nav items equal.")
          PY
      - name: Commit only index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Align Learn audio top-right and Quiz audio page bottom-right"
          git push
