name: One-time Dutch Learning layout refinement
on:
  push:
    paths:
      - '.github/workflows/layout-refinement-once.yml'
permissions:
  contents: write
jobs:
  adjust-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Learn and adjust only bottom navigation + Quiz
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          assert s.count('class="mobile-nav-action nav-action') == 6
          assert s.count('id="reviewQuizAudio"') == 1
          assert s.count('id="wordAudio"') == 1 and s.count('id="sentenceAudio"') == 1
          pattern = r'\n<style>\n/\* Dutch Learning: equal six-module navigation and Quiz audio placement \(2026-11-06\) \*/.*?</style>\n'
          s, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
          assert n == 1, "Earlier added style not found - stop without changing index.html"
          css = "<style>\n/* Scoped layout adjustment: bottom navigation and Quiz only. */\n@media (max-width:1000px), (pointer:coarse) {\n  .mobile-bottom-nav {\n    display:flex!important;\n    justify-content:space-between!important;\n    gap:0!important;\n    overflow-x:hidden!important;\n  }\n  .mobile-bottom-nav > .mobile-nav-action {\n    flex:1 1 0!important;\n    width:0!important;\n    min-width:0!important;\n    max-width:none!important;\n    box-sizing:border-box!important;\n  }\n  .mobile-bottom-nav > .mobile-nav-action small {\n    max-width:100%;\n    overflow:hidden;\n    text-overflow:ellipsis;\n  }\n}\n.review-quiz-word {\n  position:relative;\n  display:flex;\n  flex-wrap:wrap;\n  align-items:flex-start;\n  padding-bottom:46px;\n}\n.review-quiz-word > .review-quiz-audio-controls {\n  position:absolute;\n  right:0;\n  bottom:0;\n  margin:0;\n  display:flex;\n  align-items:center;\n  gap:6px;\n}\n.review-quiz-word > .review-quiz-audio-controls > .audio.small {\n  width:38px;\n  height:38px;\n  min-height:38px;\n  border-radius:50%;\n  font-size:18px;\n  padding:0;\n  display:inline-flex;\n  align-items:center;\n  justify-content:center;\n  line-height:1;\n}\n</style>"
          s = s.replace("</head>", "\n"+css+"\n</head>", 1)
          p.write_text(s,encoding="utf-8")
          print("Replaced previous CSS; scoped strictly to bottom navigation and Quiz. Learn unchanged.")
          PY
      - name: Commit only index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Scope audio styling to Quiz and evenly space nav modules"
          git push
