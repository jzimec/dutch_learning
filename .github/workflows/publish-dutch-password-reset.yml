name: Validate and publish Dutch password recovery
on:
  push:
    paths:
      - '.github/workflows/publish-dutch-password-reset.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check account Javascript and bump only its cache version
        run: |
          node --check dutch-auth.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<script src="./dutch-auth.js?v=1"></script>'
          assert s.count(old)==1
          s=s.replace(old,'<script src="./dutch-auth.js?v=2"></script>',1)
          p.write_text(s,encoding='utf-8')
          print("Account script cache updated, learning modules untouched")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Load updated account password reset controls"
          git push
