name: Use password-manager-friendly Dialogue AI authentication
on:
  push:
    paths:
      - '.github/workflows/dialogue-password-manager-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify Dialogue authentication only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('  let token=window.__dutchDialogueAiToken||\'\';',s.index('async function dialogueCheck(value,isVoice){'))
          b=s.index("  result.innerHTML='<div class=\"dialogue-feedback warn\">AI 正在检查语法与句意…</div>';",a)
          old=s[a:b]
          assert "sessionStorage.getItem('dutchDialogueAiToken')" in old
          assert "window.prompt(" in old
          new="""  let token=window.__dutchDialogueAiToken||'';
            if(!token){
              const entered=await dialogueAskAccessPassword();
              if(!entered){result.innerHTML='<div class="dialogue-feedback warn">AI 检查尚未授权，未提交句子。</div>';return;}
              token=entered.trim();
              window.__dutchDialogueAiToken=token;
            }
          """
          s=s[:a]+new+s[b:]
          old_reset="""      window.__dutchDialogueAiToken='';
                try{sessionStorage.removeItem('dutchDialogueAiToken');}catch(e){}"""
          assert s.count(old_reset)==1
          s=s.replace(old_reset,"      window.__dutchDialogueAiToken='';",1)
          position=s.index('async function dialogueCheck(value,isVoice){')
          helper="""function dialogueAskAccessPassword(){
            return new Promise(resolve=>{
              const overlay=document.createElement('div');
              overlay.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px';
              const form=document.createElement('form');
              form.style.cssText='background:#fff;color:#222;border-radius:14px;padding:22px;max-width:370px;width:100%;box-sizing:border-box;display:grid;gap:12px;font:16px system-ui,sans-serif';
              const title=document.createElement('strong');
              title.textContent='Dialogue AI 授权';
              const hint=document.createElement('div');
              hint.textContent='输入一次访问密码。可使用手机密码管理器自动填入；App 不会自行保存到浏览器存储。';
              hint.style.cssText='font-size:14px;line-height:1.5';
              const user=document.createElement('input');
              user.type='text';user.name='username';user.autocomplete='username';user.value='dutch-dialogue-ai';user.style.display='none';
              const input=document.createElement('input');
              input.type='password';input.name='password';input.autocomplete='current-password';input.required=true;
              input.placeholder='访问密码';input.style.cssText='box-sizing:border-box;width:100%;font-size:16px;padding:10px;border:1px solid #aaa;border-radius:8px';
              const actions=document.createElement('div');
              actions.style.cssText='display:flex;justify-content:flex-end;gap:10px';
              const cancel=document.createElement('button');cancel.type='button';cancel.textContent='取消';
              const confirm=document.createElement('button');confirm.type='submit';confirm.textContent='确认';
              for(const btn of [cancel,confirm])btn.style.cssText='padding:9px 15px;border-radius:8px;border:1px solid #aaa';
              function done(value){overlay.remove();resolve(value);}
              cancel.onclick=()=>done('');
              overlay.addEventListener('click',e=>{if(e.target===overlay)done('');});
              form.addEventListener('submit',e=>{e.preventDefault();done(input.value);});
              actions.append(cancel,confirm);
              form.append(title,hint,user,input,actions);overlay.append(form);document.body.append(overlay);input.focus();
            });
          }
          
          """
          s=s[:position]+helper+s[position:]
          assert "sessionStorage.getItem('dutchDialogueAiToken')" not in s
          assert "sessionStorage.setItem('dutchDialogueAiToken'" not in s
          assert "sessionStorage.removeItem('dutchDialogueAiToken')" not in s
          assert s.count('async function dialogueCheck(value,isVoice){')==1
          assert s.count('function dialogueAskAccessPassword(){')==1
          assert s.count('dialogue-ai-config.js')==1
          p.write_text(s,encoding='utf-8')
          print('Only Dialogue AI auth prompt changed; browser storage removed')
          PY
      - name: Check Dialogue JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('function dialogueAskAccessPassword(){')
          b=s.index('function dialogueStartMic(){',a)
          Path('/tmp/dutch-dialogue-auth.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dutch-dialogue-auth.js
      - name: Commit only index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Use browser password autofill and memory-only token for Dialogue"
          git push
