name: Publish startup login and email rate limit messaging
on:
  push:
    paths:
      - '.github/workflows/publish-startup-login-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check auth JS syntax and refresh account script
        run: |
          node --check dutch-auth.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='<script src="./dutch-auth.js?v=3"></script>'
          assert s.count(old)==1, "Unexpected account script version; no changes applied"
          s=s.replace(old,'<script src="./dutch-auth.js?v=4"></script>',1)
          p.write_text(s,encoding="utf-8")
          print("Only account script cache-buster updated.")
          PY
      - name: Commit account script cache change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Load startup account login and email limit messaging"
          git push
