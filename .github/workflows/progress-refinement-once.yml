name: One-time Dutch Learning Progress and UI correction
on:
  push:
    paths:
      - '.github/workflows/progress-refinement-once.yml'
permissions:
  contents: write
jobs:
  adjust-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Quiz spacing Learn alignment and Progress Status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          assert s.count('id="wordAudio"')==1 and s.count('id="sentenceAudio"')==1
          assert s.count('id="reviewQuizAudio"')==1
          assert s.count('class="progress-table"')==1
          # Guarantee the visible Progress table has exactly five columns.
          h='<th>Wrong</th><th>Status</th></tr>'
          r='<td>${p.wrong}</td><td>${status}</td></tr>'
          if h in s:
              assert s.count(h)==1
              s=s.replace(h,'<th>Wrong</th></tr>',1)
          if r in s:
              assert s.count(r)==1
              s=s.replace(r,'<td>${p.wrong}</td></tr>',1)
          assert h not in s and r not in s
          assert '<th>Wrong</th></tr>' in s
          assert '<td>${p.wrong}</td></tr>' in s
          # Replace only our own most recent corrective stylesheet, if script is rerun.
          mark='/* 2026-11-06: user-requested fixes only: Quiz option size, Learn audio alignment, Progress columns. */'
          if mark in s:
              s,n=re.subn(r'<style>\s*/\* 2026-11-06: user-requested fixes only: Quiz option size, Learn audio alignment, Progress columns\. \*/.*?</style>','',s,count=1,flags=re.S)
              assert n==1
          css="<style>\n/* 2026-11-06: user-requested fixes only: Quiz option size, Learn audio alignment, Progress columns. */\n#specialView .review-quiz-options {gap:9px!important;}\n#specialView .review-quiz-option {\n  display:flex!important;\n  align-items:center!important;\n  justify-content:space-between!important;\n  min-height:0!important;\n  height:auto!important;\n  padding:11px 12px!important;\n  font-size:17px!important;\n  line-height:1.28!important;\n  font-weight:650!important;\n  gap:10px!important;\n}\n#specialView .review-quiz-option .quiz-option-en,\n#specialView .review-quiz-option .quiz-option-zh {\n  font-size:17px!important;\n  line-height:1.28!important;\n  font-weight:650!important;\n}\n@media (max-width:1000px), (pointer:coarse) {\n  #learningView > .mobile-word-card,\n  #learningView > .mobile-sentence-card {\n    position:relative!important;\n    overflow:visible!important;\n  }\n  #learningView .mobile-word-card .learn-audio-stack,\n  #learningView .mobile-sentence-card .learn-audio-stack {\n    position:absolute!important;\n    top:7px!important;\n    right:9px!important;\n    left:auto!important;\n    bottom:auto!important;\n    transform:none!important;\n    margin:0!important;\n    width:36px!important;\n    flex-basis:auto!important;\n    gap:4px!important;\n    display:flex!important;\n    flex-direction:column!important;\n    z-index:5!important;\n  }\n  #learningView .mobile-word-card .learn-audio-stack > button,\n  #learningView .mobile-sentence-card .learn-audio-stack > button {\n    width:36px!important;\n    height:32px!important;\n    min-width:36px!important;\n    min-height:32px!important;\n    padding:0!important;\n    font-size:17px!important;\n    line-height:1!important;\n    flex:none!important;\n  }\n  #learningView .mobile-word-card .text-wrap,\n  #learningView .mobile-sentence-card .sentence-mobile-content {padding-right:53px!important;}\n}\n.progress-scroll {overflow-x:auto!important;}\n.progress-scroll .progress-table {table-layout:auto!important;min-width:500px!important;}\n.progress-scroll .progress-table td,.progress-scroll .progress-table th {\n  font-size:14px!important;white-space:nowrap!important;\n  overflow-wrap:normal!important;word-break:normal!important;\n}\n</style>"
          assert s.count("</head>")==1
          s=s.replace("</head>",css+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          print("Verification: Status heading",s.count("<th>Status</th>"),"Progress row status cell",s.count("<td>${status}</td>"))
          print("Verified Learn audio button IDs and Quiz audio ID; adjusted only CSS and Progress columns.")
          PY
      - name: Commit only index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix Quiz option dimensions and Learn audio position; verify five Progress columns"
          git push
