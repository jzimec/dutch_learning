  <title>Dutch Learning</title>
  <!-- Mobile UI v4.6.6 -->
  <style>

:root{
  --line:#e5e9ef;
  --blue-bg:#edf5ff; --blue-bd:#a8c5ea; --blue-soft:#e8f2ff;
  --green-bg:#eff8ef; --green-bd:#aacda4; --green-soft:#ebf5e8;
  --orange-bg:#fdf6e8; --orange-bd:#e0c58a; --orange-soft:#fbf1db;
  --purple-bg:#f6f1fd; --purple-bd:#d5c0ec; --purple-soft:#efe8fa;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#fff;color:#1f252b}
button{font:inherit}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:270px;flex:0 0 auto;padding:24px 18px;border-right:1px solid var(--line);background:#fff}
.brand{font-size:22px;font-weight:800;margin:2px 10px 18px}
.side-item{width:100%;border:0;background:#fff;border-radius:12px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;font-size:17px;margin:3px 0}
.side-item.active{background:#1769ff;color:#fff}
.badge{margin-left:auto;background:#ff5d3e;color:#fff;border-radius:20px;padding:2px 8px;font-size:12px}
.side-heading{font-weight:700;margin:26px 4px 10px}
.category{width:100%;text-align:left;background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:13px 12px;margin:6px 0;cursor:pointer}
.category.selected{background:#f3f8ef;border-color:#aaca9d}
.stats-box{margin-top:40px;border:1px solid #e2e6eb;border-radius:13px;padding:14px}
.stats-box div{display:flex;justify-content:space-between;margin:12px 0}
.stats-box b{color:#145ed7}
.side-note{margin-top:14px;color:#7a818a;font-size:12px;line-height:1.4}
.main-area{flex:1;min-width:0;padding:22px 26px 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.nav-arrow{width:48px;height:48px;border:1px solid #dde3e8;border-radius:12px;background:#fff;font-size:30px;cursor:pointer}
.counter{font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{border:1px solid;border-radius:18px;padding:14px 16px 16px;overflow:hidden;min-height:332px}
.word-card{background:var(--blue-bg);border-color:var(--blue-bd);grid-column:span 6}
.sentence-card{background:var(--green-bg);border-color:var(--green-bd);grid-column:span 6}
.story-card{background:var(--orange-bg);border-color:var(--orange-bd);grid-column:span 8}
.quiz-card{background:var(--purple-bg);border-color:var(--purple-bd);grid-column:span 4}
.label{font-size:20px;font-weight:800;margin:2px 0 12px}
.blue{color:#1966d8}.green{color:#167c39}.orange{color:#bf7a13}.purple{color:#6f38ba}
.split-2{display:grid;grid-template-columns:47% 1fr;gap:18px;align-items:center;min-height:265px}
.story-layout{display:grid;grid-template-columns:45% 1fr;gap:18px;align-items:center;min-height:278px}
.quiz-layout{display:block}
.img-wrap{border-radius:18px;padding:8px;display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden}
.word-wrap{background:linear-gradient(180deg,var(--blue-soft),rgba(232,242,255,.38))}
.sentence-wrap{background:linear-gradient(180deg,var(--green-soft),rgba(235,245,232,.38))}
.story-wrap{background:linear-gradient(180deg,var(--orange-soft),rgba(251,241,219,.38))}
.quiz-wrap{background:linear-gradient(180deg,var(--purple-soft),rgba(239,232,250,.42))}
.word-wrap,.sentence-wrap{height:235px}
.story-wrap{height:276px}
.quiz-wrap{height:162px}
.img-wrap img{display:block;max-width:88%;max-height:88%;object-fit:contain;object-position:center center;filter:saturate(.94) brightness(1.01)}
.story-wrap img{max-width:94%;max-height:94%}
.quiz-wrap img{max-width:82%;max-height:82%}
.text-wrap{min-width:0}.center-text{text-align:center}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px}.title-row.top-align{justify-content:flex-start;align-items:flex-start}
.title-row h1{margin:0 0 10px;font-size:34px;line-height:1.08;color:#1a5fd5}.title-row h2{margin:0 0 12px;font-size:28px;line-height:1.28;color:#177f39}
.sub{font-size:18px;color:#454d55;margin:7px 0;text-align:center}.sub.left{text-align:left}
.zh{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.audio{border:0;border-radius:50%;width:44px;height:44px;color:#fff;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 5px rgba(0,0,0,.06)}
.audio.small{width:38px;height:38px}
.blue-audio{background:#2f79ea}.green-audio{background:#4dae58}.purple-audio{background:#7d58c6}
.story-col{min-width:0}.story-nl{font-size:16px;line-height:1.48;font-weight:600}.story-translation{margin-top:10px;font-size:14px;line-height:1.5;color:#68717a}
.story-audio{margin-top:15px;border:0;background:#eba641;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer}
.quiz-head{display:flex;justify-content:space-between;align-items:center}.quiz-progress{font-size:13px;background:#eadff7;color:#6d43b3;border-radius:9px;padding:5px 10px}
.quiz-question{font-size:16px;margin:6px 0 8px}.quiz-word-row{display:flex;align-items:center;gap:10px;font-size:19px;color:#5d37b7;margin-bottom:10px}
.answers{display:grid;gap:8px}.answer{border:1px solid #d7dce3;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer}.answer.correct{background:#eef8ee;border-color:#6ebc75}.answer.wrong{background:#fff0f0;border-color:#e08a8a}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;min-height:42px;font-weight:700}.feedback.good{background:#eef8ee;color:#1a7f3b}.feedback.bad{background:#fff0f0;color:#b34b4b}
.footer{display:flex;justify-content:space-between;color:#6b747c;font-size:14px;padding:14px 4px 0}
@media (max-width:1150px){.sidebar{width:220px}.split-2,.story-layout,.quiz-layout{grid-template-columns:1fr}.card{min-height:auto}}
@media (max-width:850px){.sidebar{display:none}.grid{grid-template-columns:1fr}}

.hidden{display:none!important}
.special-view{min-height:650px;border:1px solid #e2e6eb;border-radius:18px;background:#fafbfc;padding:24px}
.special-title{font-size:27px;font-weight:800;margin:0 0 18px}
.special-sub{color:#6b747c;margin-bottom:20px}
.item-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.list-card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:16px;cursor:pointer;text-align:left}
.list-card:hover{background:#f4f7fa}
.list-card .nl{font-size:21px;font-weight:800;margin-bottom:5px}
.list-card .trans{color:#68717a;margin:3px 0}
.progress-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
.progress-table th,.progress-table td{border-bottom:1px solid #e7eaee;padding:12px 10px;text-align:left}
.progress-table th{background:#f3f5f7}
.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.category-card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:22px;cursor:pointer}
.category-card h3{margin:0 0 8px;font-size:21px}
.category-card p{color:#68717a;margin:0}
.empty-state{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:22px;color:#5e6670}

/* v3.2: scalable categories + text-only story/quiz */
.category-list{max-height:330px;overflow:auto;padding-right:3px}
.category-list .category{display:block}
.story-text-only{display:block;min-height:278px}
.story-text-only .story-col{max-width:900px;margin:8px auto 0;font-size:16px}
.quiz-layout{grid-template-columns:38% 1fr}
.quiz-left{padding-top:4px}
.quiz-card .quiz-word-row{margin-top:14px}
@media(max-width:1150px){.quiz-layout{grid-template-columns:1fr}}

/* v3.4: when a lesson intentionally has no verified image, do not leave an empty image column. */
.split-2.no-image{grid-template-columns:1fr;}
.split-2.no-image .text-wrap{text-align:center;max-width:620px;margin:0 auto;}
.split-2.no-image .title-row.top-align{justify-content:center;}
.split-2.no-image .sub.left{text-align:center;}


/* v3.6 — sentence-aligned trilingual story table */
.story-header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.story-header-row .label{margin-bottom:0}
.story-audio.compact{margin:0;padding:8px 13px;font-size:14px;white-space:nowrap}
.story-table-wrap{width:100%;overflow-x:auto;border:1px solid rgba(191,122,19,.18);border-radius:12px;background:rgba(255,255,255,.28)}
.story-table{width:100%;border-collapse:collapse;table-layout:fixed}
.story-table th{font-size:13px;text-align:left;padding:9px 11px;background:rgba(239,216,164,.28);color:#8b641f;border-bottom:1px solid rgba(191,122,19,.18)}
.story-table td{vertical-align:top;padding:10px 11px;font-size:14px;line-height:1.42;border-bottom:1px solid rgba(191,122,19,.13);word-break:normal;overflow-wrap:anywhere}
.story-table tr:last-child td{border-bottom:0}
.story-table td:nth-child(1){font-weight:600;color:#2f3439}
.story-table td:nth-child(2){color:#5e666e}
.story-table td:nth-child(3){color:#5e666e;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.quiz-card .answer{padding:9px 10px}
.quiz-card .answers{gap:6px}
.quiz-card .feedback{padding:8px 10px;min-height:38px;font-size:14px}

@media (max-width:1150px){
  .word-card,.sentence-card{grid-column:span 6}
  .story-card{grid-column:span 7}
  .quiz-card{grid-column:span 5}
  .story-table td{font-size:13px;padding:8px 9px}
}
@media (max-width:900px){
  .word-card,.sentence-card,.story-card,.quiz-card{grid-column:1 / -1}
}

/* v3.7 — Story typography aligned with the other learning sections */
.story-table th{
  font-size:16px;
  padding:10px 12px;
}
.story-table td{
  font-size:18px;
  line-height:1.5;
  padding:12px 13px;
}
.story-table td:nth-child(1){
  font-weight:600;
}
.story-audio.compact{
  font-size:16px;
  padding:9px 15px;
}
@media (max-width:1150px){

<script src="./learning-data.js?v=2"></script>
<script>
let lessonsData=null;
let categoryMeta={};
let category=null;
let index=0;
let activeView='learn';
const storageKey='dutchLearningProgressV43';
const oldStorageKeys=['dutchLearningProgressV32'];
let progress=JSON.parse(localStorage.getItem(storageKey)||'{}');
if(!Object.keys(progress).length){
  for(const k of oldStorageKeys){
    const old=JSON.parse(localStorage.getItem(k)||'{}');
    if(Object.keys(old).length){progress=old;break;}
  }
}
let seenCounter=Number(localStorage.getItem('dutchLearningSeenCounterV43')||0);
let wrongCounter=Number(localStorage.getItem('dutchLearningWrongCounterV43')||0);
let reviewQuizSession=null;
const $=id=>document.getElementById(id);

function normalizeProgressRecord(p){
  p=p||{};
  p.correct=Number(p.correct||0);p.wrong=Number(p.wrong||0);
  if(p.seen===undefined) p.seen=(p.correct>0||p.wrong>0);
  if(!p.seenOrder && p.seen){seenCounter++;p.seenOrder=seenCounter;}
  p.everWrong=Boolean(p.everWrong||p.wrong>0||p.reviewQuizWrong>0);
  p.reviewQuizWrong=Number(p.reviewQuizWrong||0);
  p.reviewQuizCorrect=Number(p.reviewQuizCorrect||0);
  p.lastWrongSeq=Number(p.lastWrongSeq||0);
  p.quizFirstTryCorrect=Boolean(p.quizFirstTryCorrect);
  return p;
}
Object.keys(progress).forEach(k=>progress[k]=normalizeProgressRecord(progress[k]));

function loadLessons(){
  categoryMeta=EMBEDDED_DATA.categoryMeta;lessonsData=EMBEDDED_DATA.categories;
  category=Object.keys(lessonsData)[0];buildCategoryList();showHome();updateStats();
}

function setImage(img,src){
  const wrap=img.closest('.img-wrap');const layout=img.closest('.split-2');
  if(src){img.src=src;img.style.display='block';if(wrap)wrap.style.display='flex';if(layout)layout.classList.remove('no-image');}
  else{img.removeAttribute('src');img.style.display='none';if(wrap)wrap.style.display='none';if(layout)layout.classList.add('no-image');}
}
function splitStorySentences(text){if(!text)return[];return (text.match(/[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g)||[]).map(s=>s.trim()).filter(Boolean);}
function renderStoryColored(lesson){
  const sets=[['storyNlColored',splitStorySentences(lesson.storyNl)],['storyEnColored',splitStorySentences(lesson.storyEn)],['storyZhColored',splitStorySentences(lesson.storyZh)]];
  sets.forEach(([id,arr])=>{const el=$(id);el.innerHTML='';arr.forEach((sentence,i)=>{const span=document.createElement('span');span.className='story-sentence s'+(i%8);span.textContent=sentence+' ';el.appendChild(span);});});
}
function categoryTitle(id){return(categoryMeta[id]&&categoryMeta[id].title)||id;}
function allLessons(){return Object.entries(lessonsData).flatMap(([cat,arr])=>arr.map((l,i)=>({...l,_cat:cat,_index:i})));}
function current(){return category&&lessonsData[category]?lessonsData[category][index]:null;}
function keyFor(l,cat=category){return`${cat}:${l.nl}`;}
function getProgress(l,cat=l._cat||category){const k=keyFor(l,cat);progress[k]=normalizeProgressRecord(progress[k]);return progress[k];}
function markSeen(l,cat=category){
  if(!l)return;const k=keyFor(l,cat);const p=normalizeProgressRecord(progress[k]);
  if(!p.seen){p.seen=true;seenCounter++;p.seenOrder=seenCounter;}
  progress[k]=p;saveProgress(false);
}
function saveProgress(refresh=true){localStorage.setItem(storageKey,JSON.stringify(progress));localStorage.setItem('dutchLearningSeenCounterV43',String(seenCounter));localStorage.setItem('dutchLearningWrongCounterV43',String(wrongCounter));if(refresh)updateStats();}
function learnedItems(){return allLessons().filter(l=>{const p=progress[keyFor(l,l._cat)];return p&&normalizeProgressRecord(p).seen;}).sort((a,b)=>getProgress(a,a._cat).seenOrder-getProgress(b,b._cat).seenOrder);}

function buildCategoryList(){
  const box=$('categoryList');box.innerHTML='';
  Object.entries(categoryMeta).forEach(([id,meta])=>{const b=document.createElement('button');b.className='category'+(id===category?' selected':'');const n=(lessonsData[id]||[]).length;b.textContent=`${meta.title} (${n})`;b.dataset.cat=id;b.onclick=()=>n?openLesson(id,0):showEmptyCategory(id);box.appendChild(b);});
}
function showEmptyCategory(id){showSpecial(`<h2 class="special-title">${categoryTitle(id)}</h2><div class="empty-state">No vocabulary in this category.</div>`,'categories');}

function selectYoungDutchVoice(){
  const voices=speechSynthesis.getVoices();
  const dutch=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('nl'));
  const youngFemaleHints=['lotte','femke','colette','claire','saskia','ellen','ilse','female','vrouw','woman','girl','young'];
  return dutch.find(v=>youngFemaleHints.some(h=>(v.name||'').toLowerCase().includes(h)))||dutch[0]||null;
}
function speakDutch(text,slow=false){
  if(!slow&&window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){
    try{window.AndroidTTS.speak(String(text||''));return;}catch(e){}
  }
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';u.rate=slow?.465:.93;u.pitch=1.15;
  const selected=selectYoungDutchVoice();if(selected)u.voice=selected;speechSynthesis.speak(u);
}
function updateStats(){
  const vals=Object.values(progress).map(normalizeProgressRecord);
  $('learnedStat').textContent=vals.filter(v=>v.seen).length;
  $('reviewStat').textContent=vals.filter(v=>v.seen&&v.everWrong).length;
  $('masteredStat').textContent=vals.filter(v=>v.correct>=3&&v.correct>v.wrong).length;
  $('reviewCount').textContent=$('reviewStat').textContent;
}

function showLearningView(){document.querySelector('.topbar').style.display='';$('counter').style.display='';activeView='learn';document.body.classList.remove('list-scroll-enabled');document.body.classList.add('learn-swipe-enabled');$('learningView').classList.remove('hidden');$('specialView').classList.add('hidden');}
function applyUnifiedModuleHeader(view){
 const root=$('specialView');
 const config={quiz:['❓','Quiz'],dialogue:['💬','Dialogue'],grammar:['📘','Grammar'],progress:['▥','Progress'],categories:['▦','Word'],review:['📋','Review'],new:['✦','New Words']};
 const item=config[view];if(!item)return;
 const oldTitle=root.querySelector(':scope > h2.special-title');
 if(oldTitle)oldTitle.remove();
 const head=document.createElement('div');head.className='unified-module-header';
 const main=document.createElement('div');main.className='unified-module-heading';
 const ico=document.createElement('span');ico.className='unified-module-icon';ico.textContent=item[0];
 const title=document.createElement('h2');title.textContent=item[1];
 main.append(ico,title);head.append(main);
 const context=document.createElement('div');context.className='unified-module-context';
 if(view==='dialogue'){
  const cat=(typeof dialogueCat!=='undefined'&&dialogueCat)||category;
  context.textContent=categoryTitle(cat);
 }else if(view==='quiz'||view==='progress'||view==='categories'||view==='review'||view==='new'){
  context.textContent='All categories';
 }else if(view==='grammar'){
  context.textContent=grammarLessonOpen ? `${GRAMMAR_LESSONS[grammarIndex].level} · ${grammarIndex+1}/${GRAMMAR_LESSONS.length}` : '';
 }
 head.append(context);root.prepend(head);
}

function showSpecial(html,view){document.querySelector('.topbar').style.display='none';$('counter').style.display='none';activeView=view;document.body.classList.remove('learn-swipe-enabled');document.body.classList.toggle('list-scroll-enabled',view==='progress'||view==='categories'||view==='new'||view==='grammar'||view==='quiz'||view==='dialogue');$('learningView').classList.add('hidden');$('specialView').classList.remove('hidden');$('specialView').innerHTML=html;applyUnifiedModuleHeader(view);setActiveSide(view);if(view==='progress'||view==='categories'||view==='new'||view==='grammar'||view==='quiz'||view==='dialogue')$('specialView').scrollTop=0;}
function openLesson(cat,idx){if(!(lessonsData[cat]||[]).length)return showEmptyCategory(cat);category=cat;index=idx;document.querySelectorAll('.category').forEach(x=>x.classList.toggle('selected',x.dataset.cat===cat));showLearningView();setActiveSide('categories');render();}

function renderForms(l){
  const box=$('wordForms');box.innerHTML='';const f=l.forms||{kind:'other'};
  let rows=[];
  if(f.kind==='verb')rows=[['Present',f.present],['Past',f.past],['Perfect',f.perfect]];
  else if(f.kind==='noun')rows=[['Singular',f.singular],['Plural',f.plural]];
  rows.filter(r=>r[1]).forEach(([label,val])=>{const row=document.createElement('div');row.className='word-form-row';row.innerHTML=`<div class="word-form-label">${label}</div><div class="word-form-value">${val}</div>`;box.appendChild(row);});
  box.style.display=rows.length?'grid':'none';
}
function renderQuiz(lesson){
  $('quizProgress').textContent=`${index+1} / ${lessonsData[category].length}`;$('quizWord').textContent=lesson.nl;$('feedback').textContent='';$('feedback').className='feedback';
  const wrongPool=allLessons().filter(x=>x.en!==lesson.en).map(x=>x.en);const uniqueWrong=[...new Set(wrongPool)].sort(()=>Math.random()-.5).slice(0,3);const options=[lesson.en,...uniqueWrong].sort(()=>Math.random()-.5);$('answers').innerHTML='';
  options.forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.onclick=()=>answerQuiz(b,opt===lesson.en);$('answers').appendChild(b);});
}
function render(){
  const l=current();if(!l){$('counter').textContent='0 / 0';return;}markSeen(l,category);
  $('counter').textContent=`${index+1} / ${lessonsData[category].length}`;
  setImage($('wordImg'),l.wordImg||'');
  $('nlWord').textContent=l.nl;$('enWord').textContent=l.en;$('zhWord').textContent=l.zh;renderForms(l);
  $('nlSentence').textContent=l.sentenceNl;$('enSentence').textContent=l.sentenceEn;$('zhSentence').textContent=l.sentenceZh;
  renderStoryColored(l);fitStoryToPhone();
  $('wordAudio').onclick=()=>speakDutch(l.nl);$('wordAudioSlow').onclick=()=>speakDutch(l.nl,true);$('sentenceAudio').onclick=()=>speakDutch(l.sentenceNl);$('sentenceAudioSlow').onclick=()=>speakDutch(l.sentenceNl,true);$('storyAudio').onclick=()=>speakDutch(l.storyNl||'');$('storyAudioSlow').onclick=()=>speakDutch(l.storyNl||'',true);
  updateStats();
}
function answerQuiz(button,ok){
  const l=current();const k=keyFor(l);const p=getProgress(l,category);
  if(ok){p.correct++;button.classList.add('correct');$('feedback').textContent=`Correct!  ${l.nl} = ${l.en}`;$('feedback').className='feedback good';}
  else{p.wrong++;p.everWrong=true;wrongCounter++;p.lastWrongSeq=wrongCounter;button.classList.add('wrong');$('feedback').textContent=`Review again: ${l.nl} = ${l.en}`;$('feedback').className='feedback bad';}
  progress[k]=p;saveProgress();
}
function next(){if(activeView!=='learn'||!category)return;index=(index+1)%lessonsData[category].length;render();}
function prev(){if(activeView!=='learn'||!category)return;index=(index-1+lessonsData[category].length)%lessonsData[category].length;render();}
function showHome(){showCategories();}

// ---------- Review: learned word list + configurable loop-until-correct quiz ----------
function showReview(){
  const learned=learnedItems().sort((a,b)=>{const pa=getProgress(a,a._cat),pb=getProgress(b,b._cat);return (pb.wrong-pa.wrong)||(pa.seenOrder-pb.seenOrder);});
  const rows=learned.map(l=>{const p=getProgress(l,l._cat);return `<tr><td>${p.seenOrder}</td><td>${categoryTitle(l._cat)}</td><td><b>${l.nl}</b></td><td>${l.en}</td><td>${l.zh}</td><td>${p.wrong}</td><td>${p.correct+p.wrong}</td></tr>`;}).join('');
  const html=`<h2 class="special-title">Review</h2><div class="review-panels">
    <section class="review-panel"><h3>Learned Word List</h3><div class="special-sub">All words you have already opened or practised.</div>
      ${learned.length?`<div class="learned-table-wrap"><table class="learned-table"><thead><tr><th>#</th><th>Category</th><th>Dutch</th><th>English</th><th>中文</th><th>Errors</th><th>Attempts</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty-state">No learned words yet.</div>'}
    </section></div>`;
  showSpecial(html,'review');
}

function showQuiz(){
  const eligible=prioritizedLearnedPool();const max=eligible.length;
  const stored=localStorage.getItem('dutchQuizRequestedCount');
  const saved=stored===null?20:Number(stored);
  const def=Math.max(1,Number.isFinite(saved)?Math.floor(saved):20);
  const html=`<h2 class="special-title">Quiz</h2><div class="review-quiz-card quiz-start-card">
    <h3>Review Quiz</h3>
    <p class="special-sub">Quiz prioritizes everyday single words, with similar-length answer choices; phrases are introduced later and matched with other phrases. Each quiz includes at least 60% never-tested words when available, with the remaining questions focused on previous mistakes. Recently tested words are deprioritised. Words answered correctly on their first attempt, or answered correctly at least five times in total, are excluded from future quizzes.</p>
    <div class="review-controls quiz-count-controls"><label for="reviewQuizCount">Number of words:</label><div class="quiz-count-picker"><button type="button" id="quizCountMinus" aria-label="Fewer words">−</button><input id="reviewQuizCount" class="review-number" type="number" inputmode="numeric" min="1" value="${def}"><button type="button" id="quizCountPlus" aria-label="More words">+</button></div><button id="startReviewQuiz" class="review-primary" ${max?'':'disabled'}>Start Quiz</button></div><p id="quizCountAvailable" class="special-sub">Available across all categories: ${max} / ${allLessons().length} words</p>
    ${max?'':`<div class="empty-state">All words have been answered correctly on their first attempt.</div>`}
  </div>`;
  showSpecial(html,'quiz');
  const input=$('reviewQuizCount');
  const readCount=()=>Math.max(1,Math.min(10000,Math.floor(Number(input.value)||1)));
  const saveCount=()=>{if(input.value.trim()!=='' && Number.isFinite(Number(input.value)) && Number(input.value)>0){localStorage.setItem('dutchQuizRequestedCount',String(readCount()));}};
  $('quizCountMinus').onclick=()=>{input.value=Math.max(1,readCount()-1);saveCount();};
  $('quizCountPlus').onclick=()=>{input.value=readCount()+1;saveCount();};
  input.addEventListener('input',saveCount);
  input.addEventListener('change',saveCount);
  const start=$('startReviewQuiz');if(start)start.onclick=()=>{saveCount();startReviewQuiz(Math.min(max,readCount()));};
}
// Keep lexical words and multiword expressions in separate quiz pools.
function quizLexicalType(l){
  const nl=String(l.nl||'').trim();
  return /\s/.test(nl)?'phrase':'word';
}
function quizEverydayRank(l){
  const catRank=['greetings_self','family_friends','home_routines','food_drink','time_numbers_plans','feelings_social','body_health','clothes_personal','school_learning','town_shopping','transport_directions'].indexOf(l._cat);
  const en=String(l.en||'').toLowerCase().trim();
  const nl=String(l.nl||'').toLowerCase().trim();
  const basics=new Set('ik jij je u hij zij het wij we jullie ze mij me mijn jouw zijn haar ons onze een de en of maar niet wel ja nee hallo dag goed goedemorgen goedenavond dank bedankt alsjeblieft alstublieft sorry water brood melk appel banaan huis school werk fiets trein bus auto winkel straat vandaag morgen gisteren ochtend avond nacht eten drinken lopen gaan komen doen maken hebben kunnen willen moeten waar wat wie hoe wanneer waarom'.split(' '));
  const first=basics.has(nl)?-100:0;
  // Category and position provide a curriculum heuristic, not a true frequency dictionary.
  return first+(catRank<0?18:catRank)*10+Math.min(199,Number(l._index)||0)/20+(quizLexicalType(l)==='phrase'?30:0)+(en.length>28?10:0);
}
function prioritizedLearnedPool(){
  // Prefer individual everyday words. Allow phrases only when single-word pool is exhausted.
  return allLessons().filter(l=>{const p=getProgress(l,l._cat);return !p.quizFirstTryCorrect && (Number(p.correct)||0)<5;});
}
function selectBalancedQuizWords(n){
  const pool=prioritizedLearnedPool();
  let recent=[];try{recent=JSON.parse(localStorage.getItem('dutchQuizRecentV1')||'[]');if(!Array.isArray(recent))recent=[];}catch(e){}
  const recentSet=new Set(recent);
  const shuffle=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
  // Broad frequency curriculum: everyday vocabulary first, without limiting to a category.
  const priorityCategories=['greetings_self','family_friends','home_routines','food_drink','time_numbers_plans','feelings_social','body_health','clothes_personal','school_learning','town_shopping','transport_directions','weather_seasons','play_sports_hobbies','animals_nature','culture_holidays','technology_media','work_professions','nurse_medical'];
  const essential=new Set('ik jij je u hij zij het wij we jullie ze mij me mijn jouw zijn haar ons onze een de en of maar niet wel ja nee hallo dag goed goedemorgen goedenavond dank bedankt alsjeblieft alstublieft sorry water eten drinken brood melk koffie thee huis thuis school werk kind kinderen vader moeder broer zus vriend vriendin naam heten hebben zijn doen gaan komen zien weten kunnen willen moeten mogen spreken zeggen vragen geven nemen maken krijgen vandaag morgen gisteren nu straks later hier daar waar wie wat waarom hoe wanneer hoeveel groot klein mooi goed slecht leuk warm koud snel langzaam tijd dag week maand jaar uur minuut geld prijs winkel fiets auto trein bus lopen fietsen rijden slapen lezen schrijven leren spelen kijken luisteren tafel stoel deur raam bed kamer keuken badkamer hond kat boek pen tas jas schoenen appel banaan ontbijt lunch avondeten'.split(' '));
  const priority=l=>quizEverydayRank(l);
  const order=a=>{const sorted=shuffle(a).sort((x,y)=>priority(x)-priority(y));const notRecent=sorted.filter(l=>!recentSet.has(keyFor(l,l._cat)));const recentItems=sorted.filter(l=>recentSet.has(keyFor(l,l._cat)));return notRecent.concat(recentItems);};
  const fresh=[],errors=[];
  for(const l of pool){const p=getProgress(l,l._cat);if(p.reviewQuizCorrect===0&&p.reviewQuizWrong===0)fresh.push(l);else errors.push(l);}
  // Target >=60% never-tested words whenever the available vocabulary allows it.
  // Remaining slots focus on historical errors; when errors are scarce, fill with new words.
  const targetFresh=Math.min(fresh.length,Math.ceil(n*.60));
  const newQueue=order(fresh);
  // Prioritise previously missed words; words already answered correctly
  // are a low-frequency fallback, even when they were wrong in the past.
  const missed=errors.filter(l=>{const p=getProgress(l,l._cat);return (Number(p.reviewQuizWrong)||0)>0 && (Number(p.reviewQuizCorrect)||0)===0;});
  const partlyKnown=errors.filter(l=>!missed.includes(l));
  const errorQueue=order(missed).concat(order(partlyKnown).sort((a,b)=>{
    const pa=getProgress(a,a._cat),pb=getProgress(b,b._cat);
    return (Number(pa.correct)||0)-(Number(pb.correct)||0);
  }));
  // Rank single words ahead of expressions in each freshness group.
  const wordFirst=queue=>queue.filter(l=>quizLexicalType(l)==='word').concat(queue.filter(l=>quizLexicalType(l)==='phrase'));
  const freshRanked=wordFirst(newQueue);
  const errorsRanked=wordFirst(errorQueue);
  const selected=freshRanked.splice(0,targetFresh);
  selected.push(...errorsRanked.splice(0,n-selected.length));
  selected.push(...freshRanked.splice(0,n-selected.length));
  selected.push(...errorsRanked.splice(0,n-selected.length));
  return shuffle(selected);
}
function startReviewQuiz(n){
  const selected=selectBalancedQuizWords(n);
  let recent=[];try{recent=JSON.parse(localStorage.getItem('dutchQuizRecentV1')||'[]');if(!Array.isArray(recent))recent=[];}catch(e){}
  const keys=selected.map(l=>keyFor(l,l._cat));
  localStorage.setItem('dutchQuizRecentV1',JSON.stringify([...recent.filter(k=>!keys.includes(k)),...keys].slice(-Math.max(80,n*3))));
  reviewQuizSession={selected,round:1,queue:[...selected],pos:0,wrongKeys:[],answered:false,guessMode:false,firstCorrect:0,firstWrongKeys:[]};
  showReviewQuizQuestion();
}
function currentReviewItem(){return reviewQuizSession&&reviewQuizSession.queue[reviewQuizSession.pos];}
function showReviewQuizQuestion(){
  const s=reviewQuizSession;if(!s)return showQuiz();
  if(s.pos>=s.queue.length){return finishReviewRound();}
  const l=currentReviewItem();
  s.guessMode=false; // Guess is selected independently for each question.
  // Match Dutch lexical type and approximate English answer length, so the
  // correct option cannot be identified by spotting the only long phrase.
  const targetType=quizLexicalType(l);
  const targetLen=String(l.en||'').length;
  const targetWords=String(l.en||'').trim().split(/\s+/).length;
  const all=allLessons();
  const seen=new Set([String(l.en||'').toLowerCase().trim()]);
  const candidates=all.filter(x=>keyFor(x,x._cat)!==keyFor(l,l._cat)&&quizLexicalType(x)===targetType&&String(x.en||'').trim());
  const scored=candidates.map(x=>{
    const len=String(x.en||'').length;
    const words=String(x.en||'').trim().split(/\s+/).length;
    const difference=Math.abs(len-targetLen)+Math.abs(words-targetWords)*5;
    return {x,score:difference+Math.random()*6};
  }).sort((a,b)=>a.score-b.score);
  const distractors=[];
  for(const item of scored){
    const x=item.x, meaning=String(x.en||'').toLowerCase().trim();
    if(seen.has(meaning))continue;
    seen.add(meaning);distractors.push(x);
    if(distractors.length===3)break;
  }
  // Unusual datasets can lack 3 same-type answers; preserve functionality.
  if(distractors.length<3){
    for(const x of all){const meaning=String(x.en||'').toLowerCase().trim();
      if(!meaning||seen.has(meaning))continue;
      seen.add(meaning);distractors.push(x);if(distractors.length===3)break;
    }
  }
  const options=[l,...distractors].sort(()=>Math.random()-.5);
  const buttons=options.map(o=>`<button class="review-quiz-option" data-answer-key="${encodeURIComponent(keyFor(o,o._cat))}"><span class="quiz-option-en">${o.en}</span><span class="quiz-option-zh">${o.zh}</span></button>`).join('');
  showSpecial(`<h2 class="special-title">Quiz</h2><div class="review-quiz-card"><div class="review-quiz-meta"><span>Round ${s.round}</span><span>${s.pos+1} / ${s.queue.length}</span></div><div class="review-quiz-word" id="reviewQuizWord"><span class="review-quiz-word-text">${l.nl}</span><span class="review-quiz-audio-controls"><button id="reviewQuizAudio" class="audio purple-audio small" title="正常语速">🔊</button><button id="reviewQuizAudioSlow" class="audio purple-audio small" title="慢速朗读">🐢</button></span></div><button type="button" id="reviewQuizGuess" class="review-quiz-guess" aria-pressed="false" title="Guess: correct answers do not increase mastery; incorrect answers count as errors">Guess</button><div class="review-quiz-options">${buttons}</div><div id="reviewQuizFeedback" class="review-quiz-feedback"></div><button id="reviewQuizNext" class="review-primary review-quiz-next hidden" style="display:none" aria-hidden="true" tabindex="-1">Next</button></div>`,'quiz');
  $('reviewQuizAudio').onclick=()=>speakDutch(l.nl);$('reviewQuizAudioSlow').onclick=()=>speakDutch(l.nl,true);
  $('reviewQuizGuess').onclick=()=>{if(s.answered)return;s.guessMode=!s.guessMode;const b=$('reviewQuizGuess');b.classList.toggle('active',s.guessMode);b.setAttribute('aria-pressed',String(s.guessMode));};
  // Speak the tested Dutch word when the learner taps an answer option.
  // The speaker button remains available for listening before answering.
  document.querySelectorAll('.review-quiz-option').forEach(b=>b.onclick=()=>{
    if(!reviewQuizSession || reviewQuizSession.answered)return;
    speakDutch(l.nl);

}
function answerReviewQuiz(button,ok){
  const s=reviewQuizSession;if(!s||s.answered)return;s.answered=true;const l=currentReviewItem();const p=getProgress(l,l._cat);const fb=$('reviewQuizFeedback');const wordEl=$('reviewQuizWord');if(wordEl){wordEl.classList.remove('quiz-word-correct','quiz-word-wrong');wordEl.classList.add(ok?'quiz-word-correct':'quiz-word-wrong');}
  const guessed=!!s.guessMode;
  if(s.round===1){if(ok){if(!guessed){s.firstCorrect++;if(p.wrong===0)p.quizFirstTryCorrect=true;}}else s.firstWrongKeys.push(keyFor(l,l._cat));}
  if(ok){if(!guessed){p.correct++;p.reviewQuizCorrect++;}button.classList.add('correct');fb.textContent='';fb.className='review-quiz-feedback good';}
  else{p.wrong++;p.reviewQuizWrong++;p.everWrong=true;wrongCounter++;p.lastWrongSeq=wrongCounter;s.wrongKeys.push(keyFor(l,l._cat));button.classList.add('wrong');document.querySelectorAll('.review-quiz-option').forEach(b=>{if(decodeURIComponent(b.dataset.answerKey)===keyFor(l,l._cat))b.classList.add('quiz-reveal-correct');});fb.textContent='';fb.className='review-quiz-feedback bad';}
  progress[keyFor(l,l._cat)]=p;saveProgress();
  document.querySelectorAll('.review-quiz-option').forEach(b=>b.disabled=true);$('reviewQuizGuess').disabled=true;const nxt=$('reviewQuizNext');if(nxt)nxt.onclick=()=>{s.pos++;s.answered=false;showReviewQuizQuestion();};
}
function finishReviewRound(){
  const s=reviewQuizSession;const unique=[...new Set(s.wrongKeys)];
  if(unique.length){
    const lookup=new Map(s.selected.map(x=>[keyFor(x,x._cat),x]));s.round++;s.queue=unique.map(k=>lookup.get(k)).filter(Boolean);s.pos=0;s.wrongKeys=[];s.answered=false;
    showSpecial(`<h2 class="special-title">Quiz</h2><div class="review-quiz-card"><h3>Round ${s.round}</h3><p>${s.queue.length} word${s.queue.length===1?'':'s'} will be tested again because they were missed in the previous round.</p><button id="continueReviewRound" class="review-primary">Continue</button></div>`,'quiz');$('continueReviewRound').onclick=showReviewQuizQuestion;
  }else{
    const total=s.selected.length;const accuracy=total?Math.round(100*s.firstCorrect/total):100;
    const lookup=new Map(s.selected.map(x=>[keyFor(x,x._cat),x]));
    const missed=[...new Set(s.firstWrongKeys)].map(k=>lookup.get(k)).filter(Boolean);
    const missedHtml=missed.length?`<h4>Words answered incorrectly (first round)</h4><ul class="quiz-summary-errors">${missed.map(l=>`<li><strong>${String(l.nl).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</strong> — ${String(l.en).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))} · ${String(l.zh).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</li>`).join('')}</ul>`:'<p>No mistakes in the first round!</p>';
    reviewQuizSession=null;showSpecial(`<h2 class="special-title">Quiz</h2><div class="review-quiz-card"><h3>Quiz summary</h3><p><strong>First-round accuracy: ${accuracy}%</strong> (${s.firstCorrect}/${total})</p><p>Incorrect words: ${missed.length} · Rounds completed: ${s.round}</p>${missedHtml}<p>All selected words have now been answered correctly. Words correct on their first attempt will not appear in future quizzes.</p><button id="backToReview" class="review-primary">Back to Quiz</button></div>`,'quiz');$('backToReview').onclick=showQuiz;
  }
}

function showNewWords(){const items=allLessons().filter(l=>{const p=progress[keyFor(l,l._cat)];return !(p&&normalizeProgressRecord(p).seen);});if(!items.length)return showSpecial('<h2 class="special-title">New Words</h2><div class="empty-state">No new words in the current library.</div>','new');const cards=items.slice(0,500).map(l=>`<button class="list-card" data-cat="${l._cat}" data-index="${l._index}"><div class="nl">${l.nl}</div><div class="trans">${l.en}</div><div class="trans">${l.zh}</div></button>`).join('');showSpecial(`<h2 class="special-title">New Words</h2><div class="special-sub">Showing the next ${Math.min(items.length,500)} of ${items.length} unlearned words.</div><div class="item-list">${cards}</div>`,'new');bindLessonCards();}
function showProgress(){const rows=allLessons().map(l=>{const p=progress[keyFor(l,l._cat)]?normalizeProgressRecord(progress[keyFor(l,l._cat)]):{correct:0,wrong:0,seen:false};const status=p.correct>=3&&p.correct>p.wrong?'Mastered':p.everWrong?'Review':p.seen?'Learning':'New';return `<tr><td title="${categoryTitle(l._cat)}">${categoryTitle(l._cat).split(/\s*&\s*|\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join("")}</td><td>${l.nl}</td><td>${l.en}</td><td>${p.correct}</td><td>${p.wrong}</td></tr>`;}).join('');showSpecial(`<h2 class="special-title">Progress</h2><div class="progress-scroll"><table class="progress-table"><thead><tr><th>Category</th><th>Dutch</th><th>English</th><th>Correct</th><th>Wrong</th></tr></thead><tbody>${rows}</tbody></table>`,'progress');}
function showCategories(){const html=Object.entries(categoryMeta).map(([id,m])=>`<button class="category-card" data-category-open="${id}"><h3>${m.title}</h3><p>${m.zh} · ${m.level} · ${(lessonsData[id]||[]).length} / ${m.target_words} words</p></button>`).join('');showSpecial(`<h2 class="special-title">Word</h2><div class="category-grid">${html}</div>`,'categories');document.querySelectorAll('[data-category-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.categoryOpen;(lessonsData[id]||[]).length?openLesson(id,0):showEmptyCategory(id);});}
function bindLessonCards(){document.querySelectorAll('.list-card').forEach(b=>b.onclick=()=>openLesson(b.dataset.cat,Number(b.dataset.index)));}

let dialogueCat=null, dialogueIndex=0, dialogueMode='text', dialogueRecognizer=null;

function dialogueEscape(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dialogueNormalize(v){return String(v||'').toLocaleLowerCase('nl-NL').normalize('NFC').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();}
function dialogueSimilarity(a,b){
 const x=dialogueNormalize(a),y=dialogueNormalize(b);if(!x||!y)return 0;
 let prev=Array.from({length:y.length+1},(_,i)=>i);
 for(let i=1;i<=x.length;i++){let row=[i];for(let j=1;j<=y.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(x[i-1]===y[j-1]?0:1));prev=row;}
 return 1-prev[y.length]/Math.max(x.length,y.length);
}

 let start=null;
 const reset=()=>{start=null;};
 const interactive=el=>!!(el&&el.closest&&el.closest('button,a,input,select,textarea,label,[role="button"],.mobile-bottom-nav,.nav-action'));
 function scrollContainer(){
   const panel=document.getElementById('specialView');
   const doc=document.scrollingElement||document.documentElement;
   // Dialogue may scroll inside #specialView or at document level depending
   // on viewport layout. Choose a container that can actually scroll.
   if(panel&&panel.scrollHeight>panel.clientHeight+6&&
      /(auto|scroll)/.test(getComputedStyle(panel).overflowY))return panel;
   return doc;
 }
 function position(box){
   const top=box.scrollTop;
   const max=Math.max(0,box.scrollHeight-box.clientHeight);
   return {overflow:max>6,top:top<=4,bottom:top>=max-4};
 }
 document.addEventListener('touchstart',e=>{
   reset();
   if(activeView!=='dialogue'||e.touches.length!==1||interactive(e.target))return;
   const box=scrollContainer();
   start={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now(),
     box,edge:position(box)};
 },{passive:true,capture:true});
 document.addEventListener('touchend',e=>{
   const g=start;reset();
   if(!g||activeView!=='dialogue'||!e.changedTouches.length||!dialogueAnswerChecked)return;
   const dx=e.changedTouches[0].clientX-g.x,dy=e.changedTouches[0].clientY-g.y;
   if(Math.abs(dy)<60||Math.abs(dy)<=Math.abs(dx)*1.2||Date.now()-g.time>=1200)return;
   const next=dy<0,now=position(g.box);
   // Never change lesson on the gesture that merely reaches a scroll edge.
   if(!g.edge.overflow||(next?g.edge.bottom&&now.bottom:g.edge.top&&now.top)){
     dialogueMove(next?1:-1);
   }
 },{passive:true,capture:true});
 document.addEventListener('touchcancel',reset,{passive:true,capture:true});
document.addEventListener('keydown',e=>{
  if(activeView!=='dialogue'||interactive(e.target))return;
  if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();dialogueMove(1);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();dialogueMove(-1);}
 });
})();

function dialogueCheckOffline(value,isVoice){
 const l=dialogueCurrent(),result=document.getElementById('dialogueResult');if(!result||!l)return;
 const text=String(value||'').trim(),target=dialogueReference(l);
 if(!text){result.innerHTML='<div class="dialogue-feedback warn">请先输入或说出一句荷兰语。</div>';return;}
 dialogueAnswerChecked=true;
  const similarity=dialogueSimilarity(text,target);
 const word=dialogueNormalize(l.nl),spoken=dialogueNormalize(text);
 const hasWord=word.length>1&&(' '+spoken+' ').includes(' '+word+' ');
 const knownError=/\bik wilt\b/i.test(text)?'“Ik wilt” 应改为 “Ik wil”。':/\bhij heb\b/i.test(text)?'“Hij heb” 应改为 “Hij heeft”。':/\bik heeft\b/i.test(text)?'“Ik heeft” 应改为 “Ik heb”。':null;
 let title,body,cls='warn';
 if(knownError){title='发现常见语法错误';body=knownError;}
 else if(similarity>=.94){title='Goed gedaan! 很好';body='你的回答与一种参考表达基本一致；其他符合问题的回答也可能正确。';cls='good';}
 else if(isVoice){title=similarity>=.75?'基本接近参考句':'与参考句有差异';body='离线检查不能完整判断回答是否符合问题。参考句只是一种表达；差异也可能来自语音识别，不代表发音错误。';}
 else if(hasWord){title='已使用目标单词';body='已识别出目标单词，但离线规则不能可靠判断整句语法是否正确。可以对照参考表达。';}
 else{title='暂时无法判断';body='你的句子可能是其他合理表达。离线模式不把未知表达直接判错。';}
 result.innerHTML='<div class="dialogue-feedback '+cls+'"><b>'+dialogueEscape(title)+'</b><div>'+dialogueEscape(body)+'</div><div style="margin-top:9px"><b>参考／建议表达：</b><div>'+dialogueEscape(target)+'</div></div><div class="dialogue-speakers"><button class="dialogue-action" id="dialogueFeedbackNormal">🔊</button><button class="dialogue-action" id="dialogueFeedbackSlow">🐢</button></div></div>';
 document.getElementById('dialogueFeedbackNormal').onclick=()=>speakDutch(target);
 document.getElementById('dialogueFeedbackSlow').onclick=()=>speakDutch(target,true);
}
function dialogueAskAccessPassword(){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px';
    const form=document.createElement('form');
    form.style.cssText='background:#fff;color:#222;border-radius:14px;padding:22px;max-width:370px;width:100%;box-sizing:border-box;display:grid;gap:12px;font:16px system-ui,sans-serif';
    const title=document.createElement('strong');
    title.textContent='Dialogue AI 授权';
    const hint=document.createElement('div');
    hint.textContent='输入一次访问密码。可使用手机密码管理器自动填入；App 不会自行保存到浏览器存储。';
    hint.style.cssText='font-size:14px;line-height:1.5';
    const user=document.createElement('input');
    user.type='text';user.name='username';user.autocomplete='username';user.value='dutch-dialogue-ai';user.style.display='none';
    const input=document.createElement('input');
    input.type='password';input.name='password';input.autocomplete='current-password';input.required=true;
    input.placeholder='访问密码';input.style.cssText='box-sizing:border-box;width:100%;font-size:16px;padding:10px;border:1px solid #aaa;border-radius:8px';
    const actions=document.createElement('div');
    actions.style.cssText='display:flex;justify-content:flex-end;gap:10px';
    const cancel=document.createElement('button');cancel.type='button';cancel.textContent='取消';
    const confirm=document.createElement('button');confirm.type='submit';confirm.textContent='确认';
    for(const btn of [cancel,confirm])btn.style.cssText='padding:9px 15px;border-radius:8px;border:1px solid #aaa';
    function done(value){overlay.remove();resolve(value);}
    cancel.onclick=()=>done('');
    overlay.addEventListener('click',e=>{if(e.target===overlay)done('');});
    form.addEventListener('submit',e=>{e.preventDefault();done(input.value);});
    actions.append(cancel,confirm);
    form.append(title,hint,user,input,actions);overlay.append(form);document.body.append(overlay);input.focus();
  });
}

async function dialogueCheck(value,isVoice){
  const l=dialogueCurrent(), result=document.getElementById('dialogueResult');
  if(!l||!result)return;
  const answer=String(value||'').trim();
  if(!answer){dialogueCheckOffline(value,isVoice);return;}
  const endpoint=String(window.DUTCH_DIALOGUE_AI_ENDPOINT||'').trim();
  if(!/^https:\/\/[-a-z0-9]+\.supabase\.co\/functions\/v1\/dialogue-check-v2\/?$/i.test(endpoint)){
    dialogueCheckOffline(value,isVoice);
    return;
  }
  let token='';
try{
  if(!window.dutchAuth)throw new Error('登录组件未加载，请刷新网页重试');
  token=await window.dutchAuth.ensure();
}catch(e){
  result.innerHTML='<div class="dialogue-feedback warn">'+dialogueEscape(e?.message||'尚未登录')+'</div>';
  return;
}
result.innerHTML='<div class="dialogue-feedback warn">AI 正在检查语法与句意…</div>';
  const currentResult=result, currentLesson=l, controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    const reply=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({
        answer:answer.slice(0,500),
        target_word:String(l.nl||''),
        reference:String(dialogueReference(l)),
        question:l.dialogue?.questionNl||('Kun je een zin maken met het woord '+String(l.nl||'')+'?')
      }),
      signal:controller.signal,
      cache:'no-store'
    });
    if(!currentResult.isConnected||dialogueCurrent()!==currentLesson)return;
    if(reply.status===401)throw new Error('登录已失效，请重新登录。');
    if(!reply.ok)throw new Error(reply.status===503?'Supabase AI 服务尚未配置。':'AI 服务暂时不可用（HTTP '+reply.status+'）。');
    const data=await reply.json();
    if(!data||!['correct','needs_revision','off_topic','uncertain'].includes(data.verdict))
      throw new Error('AI 返回了无法识别的结果。');
    dialogueAnswerChecked=true;
    const titleMap={
      correct:'✓ 正确 · Goed gedaan!',
      needs_revision:'需要修改',
      off_topic:'语法可能正确，但不符合题意',
      uncertain:'暂时无法确定'
    };
    const cls=data.verdict==='correct'?'good':'warn';
    const corrected=String(data.corrected_dutch||'').trim();
    const example=corrected||String(dialogueReference(l));
    const explanation=String(data.explanation_zh||'').trim();
    const comments=String(data.feedback_zh||'').trim();
    currentResult.innerHTML='<div class="dialogue-feedback '+cls+'"><b>'+dialogueEscape(titleMap[data.verdict])+'</b>'+
      '<div>'+dialogueEscape(comments)+'</div>'+
      (explanation?'<div>'+dialogueEscape(explanation)+'</div>':'')+
      (isVoice?'<div>提示：这里只判断语音识别后的文字，不评价发音准确度。</div>':'')+
      '<div style="margin-top:9px"><b>'+(corrected?'建议表达：':'参考表达：')+'</b><div>'+dialogueEscape(example)+'</div></div>'+
      '<div class="dialogue-speakers"><button class="dialogue-action" id="dialogueFeedbackNormal">🔊</button><button class="dialogue-action" id="dialogueFeedbackSlow">🐢</button></div></div>';
    const normal=document.getElementById('dialogueFeedbackNormal');
    const slow=document.getElementById('dialogueFeedbackSlow');
    if(normal)normal.onclick=()=>speakDutch(example);
    if(slow)slow.onclick=()=>speakDutch(example,true);
  }catch(err){
    if(!currentResult.isConnected||dialogueCurrent()!==currentLesson)return;
    dialogueCheckOffline(value,isVoice);
    const notice=document.createElement('div');
    notice.className='dialogue-feedback warn';notice.setAttribute('role','status');
    notice.textContent='AI 暂时不可用，已切换离线检查。离线检查只能识别部分语法问题，不能完整判断语法和句意。';
    currentResult.prepend(notice);
  }finally{clearTimeout(timeout);}
}

function dialogueStartMic(){
 const status=document.getElementById('dialogueMicStatus');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){status.textContent='此浏览器不支持语音识别。可以在文字框手动输入后检查。';return;}
 dialogueStopMic();
 const r=new SpeechRecognition();dialogueRecognizer=r;r.lang='nl-BE';r.interimResults=false;r.maxAlternatives=1;r.continuous=false;
 r.onstart=()=>{if(status)status.textContent='正在聆听… 请用荷兰语说话。';};
 r.onresult=e=>{if(dialogueRecognizer!==r)return;const text=Array.from(e.results).map(x=>x[0].transcript).join(' ');const box=document.getElementById('dialogueTextReply');if(box)box.value=text;if(status)status.textContent='已识别，可修改';dialogueCheck(text,true);};
 r.onerror=e=>{if(status)status.textContent='语音识别失败：'+e.error+'。可能需要联网或麦克风权限。';};
 r.onend=()=>{if(dialogueRecognizer===r)dialogueRecognizer=null;};
 try{r.start();}catch(e){if(status)status.textContent='无法启动语音识别：'+e.message;}
}

// v4.6.5 — whole-screen vertical swipe navigation while Learn is active.
(function enableWholeLearnScreenSwipe(){
  let startX=null,startY=null,startTime=0,startedOnInteractive=false,blockedVertical=false;
  const reset=()=>{startX=null;startY=null;startTime=0;startedOnInteractive=false;blockedVertical=false;};
  const isInteractive=el=>!!(el&&el.closest&&el.closest('button,a,input,select,textarea,label,[role="button"],.mobile-bottom-nav,.nav-action'));
  const syncSwipeState=()=>document.body.classList.toggle('learn-swipe-enabled',activeView==='learn');

  document.addEventListener('touchstart',e=>{
    syncSwipeState();
    if(activeView!=='learn'||e.touches.length!==1){reset();return;}
    startedOnInteractive=isInteractive(e.target);
    if(startedOnInteractive){reset();return;}
    const t=e.touches[0];startX=t.clientX;startY=t.clientY;startTime=Date.now();
  },{passive:true,capture:true});

  document.addEventListener('touchmove',e=>{
    if(startY===null||activeView!=='learn'||startedOnInteractive||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;
    // Once a clear vertical gesture starts, stop native vertical scrolling so the
    // gesture behaves as page navigation. Horizontal Story scrolling stays available.
    if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)*1.15){blockedVertical=true;e.preventDefault();}
  },{passive:false,capture:true});

  document.addEventListener('touchend',e=>{
    if(startY===null||activeView!=='learn'||startedOnInteractive||!e.changedTouches.length){reset();return;}
    const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY,elapsed=Date.now()-startTime;
    const vertical=Math.abs(dy)>=55&&Math.abs(dy)>Math.abs(dx)*1.15&&elapsed<1200;
    if(vertical){
      dy<0?next():prev();
      // A swipe is a page change: show the new Word from the top of the Learn page.
      try{window.scrollTo({top:0,left:0,behavior:'instant'});}catch(_){window.scrollTo(0,0);}
    }
    reset();
  },{passive:true,capture:true});

  document.addEventListener('touchcancel',reset,{passive:true,capture:true});
  syncSwipeState();
})();


// Grammar lessons: swipe up for next lesson, down for previous lesson.
(function enableGrammarLessonSwipe(){
  let sx=null,sy=null,started=0,edgeAtStart=false;
  const reset=()=>{sx=null;sy=null;started=0;edgeAtStart=false;};
  const scrollBox=()=>document.getElementById('specialView');
  document.addEventListener('touchstart',e=>{
    reset();
    if(activeView!=='grammar'||!grammarLessonOpen||e.touches.length!==1)return;
    if(e.target.closest('button,a,input,select,textarea,.mobile-bottom-nav,.nav-action'))return;
    const box=scrollBox();
    if(!box)return;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;started=Date.now();
    // Remember the scroll position BEFORE this gesture. Reaching the edge
    // during this gesture must never trigger a lesson change.
    const tolerance=4;
    edgeAtStart={top:box.scrollTop<=tolerance,
      bottom:box.scrollTop+box.clientHeight>=box.scrollHeight-tolerance};
  },{passive:true,capture:true});
  document.addEventListener('touchend',e=>{
    if(sy===null||activeView!=='grammar'||!grammarLessonOpen||!e.changedTouches.length){reset();return;}
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    const valid=Math.abs(dy)>=65&&Math.abs(dy)>Math.abs(dx)*1.2&&Date.now()-started<1100;
    const box=scrollBox();
    if(valid&&box&&edgeAtStart){
      // Upward swipe from an already-reached bottom = next lesson;
      // downward swipe from an already-reached top = previous lesson.
      const next=dy<0;
      const stillAtEdge=next
        ? box.scrollTop+box.clientHeight>=box.scrollHeight-4
        : box.scrollTop<=4;
      if(stillAtEdge&&(next?edgeAtStart.bottom:edgeAtStart.top)){
        const target=grammarIndex+(next?1:-1);
        if(target>=0&&target<GRAMMAR_LESSONS.length){
          showGrammarLesson(target);
          box.scrollTop=0;
          window.scrollTo(0,0);
        }
      }
    }
    reset();
  },{passive:true,capture:true});
  document.addEventListener('touchcancel',reset,{passive:true,capture:true});
})();

// v4.6.6 — shrink Story typography only as much as necessary to keep all three
// language columns inside the remaining phone screen area. No story text is removed.
function fitStoryToPhone(){
  if(!window.matchMedia('(max-width:1000px), (pointer:coarse)').matches)return;
  const card=document.querySelector('.mobile-story-card');
  if(!card||card.classList.contains('hidden'))return;
  const texts=[...card.querySelectorAll('.story-colored-text')];
  if(!texts.length)return;
  const root=document.documentElement;
  let size=14;
  let line=1.18;
  const minSize=14;
  root.style.setProperty('--story-fit-font',size+'px');
  root.style.setProperty('--story-fit-line',String(line));
  // Let layout settle before measuring.
  requestAnimationFrame(()=>{
    const blocks=[...card.querySelectorAll('.story-language-block')];
    const fits=()=>blocks.every(b=>b.scrollHeight<=b.clientHeight+1);
    while(!fits()&&size>minSize){
      size=Math.max(minSize,size-0.35);
      if(size<9.2)line=1.12;
      root.style.setProperty('--story-fit-font',size.toFixed(2)+'px');
      root.style.setProperty('--story-fit-line',String(line));
    }
  });
}
window.addEventListener('resize',()=>{if(activeView==='learn')fitStoryToPhone();},{passive:true});

/* Module swipe navigation only; existing click navigation and vertical gestures remain unchanged. */
(function enableHorizontalModuleSwipe(){
  let gesture=null;
  const tabSelector='.mobile-bottom-nav .mobile-nav-action[data-view]';
  function reset(){gesture=null;}
  document.addEventListener('touchstart',function(e){
    reset();
    if(e.touches.length!==1)return;
    if(!window.matchMedia('(max-width:1000px), (pointer:coarse)').matches)return;
    const el=e.target;
    if(el.closest('input,textarea,select,[contenteditable="true"],.mobile-bottom-nav,.nav-action'))return;
    // Don't override gestures within independently horizontal-scrolling controls.
    if(el.closest('.story-strip,.story-scroller,.story-slider,.dialogue-story-strip,.carousel,[data-horizontal-scroll]'))return;
    const t=e.touches[0];
    gesture={x:t.clientX,y:t.clientY,view:activeView,t:Date.now()};
  },{capture:true,passive:true});
  document.addEventListener('touchend',function(e){
    if(!gesture||e.changedTouches.length!==1)return;
    const g=gesture;reset();
    if(g.view!==activeView)return;
    const t=e.changedTouches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
    if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4||Date.now()-g.t>1600)return;
    const tabs=Array.from(document.querySelectorAll(tabSelector));
    const key=g.view==='learn'?'categories':g.view;
    const index=tabs.findIndex(el=>el.dataset.view===key);
    if(index<0)return;
    const destination=tabs[index+(dx<0?1:-1)];
    if(destination)destination.click();
  },{capture:true,passive:true});
  document.addEventListener('touchcancel',reset,{capture:true,passive:true});
})();
